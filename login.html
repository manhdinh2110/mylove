<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gõ cửa trái tim</title>
  <meta name="description" content="Nhập mật khẩu để mở hành trình của hai ta." />
  <meta name="theme-color" content="#fdf1f4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1a1214" media="(prefers-color-scheme: dark)" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23d4587f' d='M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 5 6.4 5c2 0 3.3 1.1 4.1 2.3h.2C11.5 6.1 12.8 5 14.8 5h0c3.4 0 5.5 3.4 4 6.8C16.7 16.4 12 21 12 21z'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css?v=20261017" />
  <script src="assets/js/data.js?v=20261017"></script>
  <script src="assets/js/cloud-config.js?v=20261017"></script>
  <script src="assets/js/cloud.js?v=20261017"></script>
  <script src="assets/js/auth.js?v=20261017"></script>
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    document.documentElement.dataset.accent = (window.LOVE_DATA && LOVE_DATA.settings && LOVE_DATA.settings.accent) || "rose";
    // Đã đăng nhập (hoặc tắt login) thì vào thẳng
    if (LoveAuth.ok() && !/[?&]setup/.test(location.search)) location.replace(LoveAuth.next());
  </script>
  <style>
    body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; overflow-x: hidden; }
    .gate__bg {
      position: fixed; inset: 0; z-index: -1;
      background:
        radial-gradient(55% 45% at 15% 10%, color-mix(in srgb, var(--accent) 24%, transparent), transparent 70%),
        radial-gradient(50% 45% at 90% 25%, color-mix(in srgb, var(--gold) 22%, transparent), transparent 70%),
        radial-gradient(70% 55% at 50% 110%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 70%),
        var(--bg);
    }
    .gate {
      position: relative; width: 100%; max-width: 400px; text-align: center;
      padding: 40px 28px 30px; border-radius: 28px;
      background: color-mix(in srgb, var(--surface) 82%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--line));
      box-shadow: var(--shadow), 0 30px 60px -30px color-mix(in srgb, var(--accent) 45%, transparent);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      animation: gateIn .9s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes gateIn { from { opacity: 0; transform: translateY(24px) scale(.97); } }
    .gate__heart {
      width: 74px; height: 74px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 50%;
      background: linear-gradient(140deg, var(--accent-soft), color-mix(in srgb, var(--gold) 18%, var(--surface)));
      box-shadow: 0 0 0 8px color-mix(in srgb, var(--accent) 8%, transparent);
      color: var(--accent); font-size: 34px;
    }
    .gate__heart svg { fill: currentColor; stroke: none; animation: beat 1.6s ease-in-out infinite; }
    .gate h1 { font-size: clamp(1.9rem, 7vw, 2.3rem); margin: 8px 0 8px; }
    .gate h1 em {
      font-style: italic; font-weight: 500;
      background: linear-gradient(100deg, var(--accent), var(--gold) 60%, var(--accent)); background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: shimmer 6s linear infinite;
    }
    .gate__sub { color: var(--ink-soft); font: italic 1rem/1.5 var(--serif); margin-bottom: 26px; }
    .gate form { display: grid; gap: 12px; text-align: left; }
    .gate label { font-size: .82rem; font-weight: 600; color: var(--ink-soft); }
    .field { position: relative; }
    .field input {
      width: 100%; padding: 13px 48px 13px 16px; border-radius: 14px; font: 500 1rem var(--sans); color: var(--ink);
      background: var(--surface); border: 1.5px solid var(--line); transition: border-color .2s, box-shadow .2s;
    }
    .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent); }
    .field button {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 38px; height: 38px;
      border: 0; border-radius: 10px; background: transparent; color: var(--ink-soft); display: grid; place-items: center; font-size: 18px;
    }
    .field button:hover { color: var(--accent); }
    .gate .go {
      margin-top: 6px; padding: 13px 18px; border: 0; border-radius: 999px; font: 700 1rem var(--sans);
      color: var(--accent-ink); background: linear-gradient(120deg, var(--accent), color-mix(in srgb, var(--accent) 70%, var(--gold)));
      box-shadow: 0 10px 24px -12px var(--accent); display: inline-flex; justify-content: center; align-items: center; gap: 8px;
      transition: transform .2s, filter .2s;
    }
    .gate .go:hover { filter: brightness(1.06); transform: translateY(-1px); }
    .gate .go svg { fill: currentColor; stroke: none; }
    .gate__hint { margin-top: 4px; font-size: .85rem; color: var(--ink-soft); text-align: center; }
    .gate__hint button { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
    .gate__hint p { margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); color: var(--ink); font: italic .95rem var(--serif); }
    .gate__err { min-height: 1.4em; font-size: .88rem; color: var(--accent); text-align: center; }
    .gate.shake { animation: shake .45s; }
    @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
    .gate.open { animation: gateOut .8s .35s cubic-bezier(.6,0,.4,1) forwards; }
    @keyframes gateOut { to { opacity: 0; transform: scale(1.06); filter: blur(4px); } }
    .lovecount {
      margin: -8px 0 24px; padding: 14px 10px 12px; border-radius: 18px;
      background: linear-gradient(140deg, var(--accent-soft), color-mix(in srgb, var(--gold) 12%, var(--surface)));
      border: 1px solid color-mix(in srgb, var(--accent) 18%, var(--line));
    }
    .lovecount__label { font-size: .74rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
    .lovecount__grid { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; }
    .lovecount__grid div { display: flex; flex-direction: column; align-items: center; }
    .lovecount__grid div + div { border-left: 1px dashed color-mix(in srgb, var(--accent) 25%, transparent); }
    .lovecount__grid span { font: 700 clamp(1.4rem, 6vw, 1.75rem)/1.1 var(--serif); font-variant-numeric: tabular-nums; color: var(--ink); }
    .lovecount__grid div:first-child span { color: var(--accent); }
    .lovecount__grid small { font-size: .68rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .08em; margin-top: 4px; }
    #lcS { display: inline-block; }
    #lcS.tick { animation: lcTick .4s ease-out; }
    @keyframes lcTick { from { transform: scale(1.18); color: var(--accent); } }
    .gate__foot { margin-top: 22px; font-size: .78rem; color: var(--ink-soft); letter-spacing: .04em; }
    @media (prefers-reduced-motion: reduce) { .gate, .gate h1 em, .gate__heart svg { animation: none !important; } #lcS.tick { animation: none; } }
  </style>
</head>
<body>
  <div class="gate__bg" aria-hidden="true"></div>
  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <main class="gate" id="gate">
    <div class="gate__heart" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 5 6.4 5c2 0 3.3 1.1 4.1 2.3h.2C11.5 6.1 12.8 5 14.8 5c3.4 0 5.5 3.4 4 6.8C16.7 16.4 12 21 12 21z"/></svg>
    </div>
    <p class="eyebrow" id="gateNames">Hai ta</p>
    <h1 id="gateTitle">Chào <em>em</em></h1>
    <p class="gate__sub" id="gateSub">Có một hành trình nhỏ đang chờ em ở phía sau cánh cửa này.</p>

    <div class="lovecount" id="loveCount" hidden>
      <p class="lovecount__label">Mình đã bên nhau</p>
      <div class="lovecount__grid">
        <div><span id="lcD">0</span><small>ngày</small></div>
        <div><span id="lcH">00</span><small>giờ</small></div>
        <div><span id="lcM">00</span><small>phút</small></div>
        <div><span id="lcS">00</span><small>giây</small></div>
      </div>
    </div>

    <form id="gateForm" autocomplete="off" novalidate>
      <label for="pw">Mật khẩu</label>
      <div class="field">
        <input id="pw" type="password" inputmode="text" autocomplete="current-password" required autofocus />
        <button type="button" id="peek" aria-label="Hiện mật khẩu" aria-pressed="false" title="Hiện / ẩn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div id="pw2Wrap" hidden>
        <label for="pw2">Nhập lại mật khẩu</label>
        <div class="field"><input id="pw2" type="password" autocomplete="new-password" /></div>
      </div>
      <p class="gate__err" id="err" role="alert"></p>
      <button class="go" type="submit">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 5 6.4 5c2 0 3.3 1.1 4.1 2.3h.2C11.5 6.1 12.8 5 14.8 5c3.4 0 5.5 3.4 4 6.8C16.7 16.4 12 21 12 21z"/></svg>
        <span id="goText">Mở cửa trái tim</span>
      </button>
    </form>

    <div class="gate__hint" id="hintBox" hidden>
      <button type="button" id="hintBtn" aria-expanded="false">Quên rồi? Xem gợi ý</button>
      <p id="hintText" hidden></p>
    </div>

    <p class="gate__foot" id="gateFoot"></p>
  </main>

  <script>
  (() => {
    const D = window.LOVE_DATA || {}, C = D.couple || {}, L = D.login || {};
    const $ = id => document.getElementById(id);
    const you = C.you || "em";
    $("gateNames").textContent = [C.me, C.you].filter(Boolean).join(" & ") || "Hai ta";
    $("gateTitle").innerHTML = "";
    $("gateTitle").append("Chào ", Object.assign(document.createElement("em"), { textContent: "dợ của ăm chả" }));
    if (L.welcome) $("gateSub").textContent = L.welcome;
    if (L.hint) { $("hintBox").hidden = false; $("hintText").textContent = L.hint; }
    $("gateFoot").textContent = "Chỉ dành riêng cho " + you + " ♥";

    // Đếm thời gian bên nhau, tính từ 0h ngày couple.since (giờ Việt Nam)
    const since = /^\d{4}-\d{2}-\d{2}$/.test(C.since || "") ? Date.parse(C.since + "T00:00:00+07:00") : NaN;
    if (!isNaN(since)) {
      $("loveCount").hidden = false;
      const pad = n => String(n).padStart(2, "0");
      const tickLove = () => {
        const t = Math.max(0, Math.floor((Date.now() - since) / 1000));
        $("lcD").textContent = Math.floor(t / 86400).toLocaleString("vi-VN");
        $("lcH").textContent = pad(Math.floor(t / 3600) % 24);
        $("lcM").textContent = pad(Math.floor(t / 60) % 60);
        const s = $("lcS"); s.textContent = pad(t % 60);
        s.classList.remove("tick"); void s.offsetWidth; s.classList.add("tick");
      };
      tickLove(); setInterval(tickLove, 1000);
    }

    $("hintBtn").addEventListener("click", e => {
      const open = $("hintText").hidden;
      $("hintText").hidden = !open; e.currentTarget.setAttribute("aria-expanded", open);
    });
    $("peek").addEventListener("click", e => {
      const show = $("pw").type === "password";
      $("pw").type = show ? "text" : "password";
      e.currentTarget.setAttribute("aria-pressed", show);
      e.currentTarget.setAttribute("aria-label", show ? "Ẩn mật khẩu" : "Hiện mật khẩu");
    });

    const tease = ["Chưa đúng rồi, thử lại nha", "Hmm… nghĩ kỹ thêm chút nữa", "Gần đúng rồi đó (chắc vậy)", "Bấm “Xem gợi ý” đi em"];
    let tries = 0;
    // Thiết lập lần đầu với Firebase: mở login.html?setup
    const cloud = LoveAuth.cloud();
    const setup = cloud && new URLSearchParams(location.search).has("setup");
    if (setup) {
      $("pw2Wrap").hidden = false;
      $("gateSub").textContent = "Thiết lập lần đầu: chọn mật khẩu chung cho hai đứa. Kế hoạch hiện tại sẽ được đưa lên mạng.";
      $("goText").textContent = "Tạo kế hoạch trên mạng";
      $("hintBox").hidden = true;
    }
    // Bản để đưa lên mạng: ưu tiên bản đã sửa trên máy này, không kèm mật khẩu cũ
    const seed = () => {
      let plan = D, check = [];
      try {
        const saved = JSON.parse(localStorage.getItem("loveData.v1") || "null");
        if (saved && saved.data && Array.isArray(saved.data.days)) plan = saved.data;
        check = JSON.parse(localStorage.getItem("checklist") || "[]");
      } catch (e) {}
      plan = JSON.parse(JSON.stringify(plan)); delete plan.login;
      return [plan, check];
    };

    let busy = false;
    $("gateForm").addEventListener("submit", async e => {
      e.preventDefault();
      if (busy) return;
      const gate = $("gate"), pw = $("pw").value;
      let ok = false;
      busy = true; $("err").textContent = cloud ? "Đang kiểm tra…" : "";
      try {
        if (setup) {
          if (pw.replace(/\s/g, "").length < 8) throw new Error("Mật khẩu nên dài ít nhất 8 ký tự");
          if (pw !== $("pw2").value) throw new Error("Hai lần nhập chưa giống nhau");
          ok = await LoveCloud.create(pw, ...seed());
        } else ok = cloud ? await LoveCloud.login(pw) : LoveAuth.login(pw);
      } catch (err) {
        busy = false;
        $("err").textContent = /Firebase|fetch/i.test(err.message) ? "Không kết nối được, kiểm tra mạng rồi thử lại" : err.message;
        return;
      }
      busy = false;
      if (ok) {
        try { sessionStorage.setItem("playAfterLogin", "Một Đời"); } catch (e) {}
        $("err").textContent = "";
        celebrate();
        gate.classList.add("open");
        setTimeout(() => location.replace(setup ? "index.html" : LoveAuth.next()), 1100);
      } else {
        $("err").textContent = tease[Math.min(tries++, tease.length - 1)];
        if (tries >= 2 && L.hint) $("hintBox").hidden = false;
        gate.classList.remove("shake"); void gate.offsetWidth; gate.classList.add("shake");
        $("pw").select();
      }
    });

    /* Hoa rơi + bung tim khi mở cửa */
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const layer = $("hearts");
    const COLORS = ["#f4a7b9", "#f7c6d0", "#ffd1dc", "#f9b4ab", "#fbe3e8", "#e8a0bf", "#f6c89f"];
    const svg = (c, petal) => petal
      ? `<svg viewBox="0 0 24 24"><path fill="${c}" d="M12 2C7 6 5 11 7.5 16.5 9 19.5 12 22 12 22s3-2.5 4.5-5.5C19 11 17 6 12 2z"/></svg>`
      : `<svg viewBox="0 0 24 24"><g fill="${c}">${[0, 72, 144, 216, 288].map(r => `<path transform="rotate(${r} 12 12)" d="M12 12C9.2 9.6 9 5.6 10.6 3.4c.5.8 1 1.1 1.4 1.1s.9-.3 1.4-1.1C15 5.6 14.8 9.6 12 12z"/>`).join("")}</g><circle cx="12" cy="12" r="2.1" fill="#f6d186"/></svg>`;
    const spawn = () => {
      if (document.hidden || layer.childElementCount > 26) return;
      const f = document.createElement("span");
      f.className = "fflower";
      f.innerHTML = `<i>${svg(COLORS[Math.random() * COLORS.length | 0], Math.random() < .55)}</i>`;
      f.style.cssText = `left:${(Math.random() * 100).toFixed(1)}vw;font-size:${(12 + Math.random() * 16) | 0}px;animation-duration:${(9 + Math.random() * 8).toFixed(1)}s;--drift:${(Math.random() * 160 - 80) | 0}px;--o:${(.55 + Math.random() * .4).toFixed(2)};--sway:${(2.5 + Math.random() * 2).toFixed(1)}s;--spin:${(Math.random() < .5 ? -1 : 1) * (180 + Math.random() * 360) | 0}deg`;
      f.addEventListener("animationend", e => { if (e.target === f) f.remove(); });
      layer.append(f);
    };
    if (!reduce && D.settings?.flowers !== false) { for (let i = 0; i < 8; i++) setTimeout(spawn, i * 200); setInterval(spawn, 550); }

    function celebrate() {
      if (reduce) return;
      const r = $("gate").getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + 90;
      for (let i = 0; i < 18; i++) {
        const h = document.createElement("span");
        h.className = "bheart";
        h.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 5 6.4 5c2 0 3.3 1.1 4.1 2.3h.2C11.5 6.1 12.8 5 14.8 5c3.4 0 5.5 3.4 4 6.8C16.7 16.4 12 21 12 21z"/></svg>';
        const a = Math.random() * Math.PI * 2, dist = 70 + Math.random() * 120;
        h.style.cssText = `left:${cx}px;top:${cy}px;--x:${Math.cos(a) * dist}px;--y:${Math.sin(a) * dist - 40}px;font-size:${14 + Math.random() * 14}px`;
        h.addEventListener("animationend", () => h.remove());
        layer.append(h);
      }
    }
  })();
  </script>
</body>
</html>
